<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast-Eaglercraft</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #182232 0%, #0b0e14 70%);
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 26, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    label.field-label {
      display: block;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0f141e;
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 18px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: #38bdf8; }
    .play-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
      transition: transform 0.1s, filter 0.15s;
    }
    .play-btn:hover { filter: brightness(1.08); }
    .play-btn:active { transform: scale(0.98); }

    .touch-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.92rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .touch-row input {
      width: 17px;
      height: 17px;
      accent-color: #22c55e;
      cursor: pointer;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 20px 0 16px;
    }
    .mods-btn {
      display: inline-block;
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      transition: background 0.15s;
    }
    .mods-btn:hover { background: rgba(56, 189, 248, 0.22); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fast-Eaglercraft</h1>
    <p class="sub">Lightweight, optimized Eaglercraft launcher</p>

    <label class="field-label" for="version-select">Version</label>
    <select id="version-select"></select>

    <button id="play-btn" class="play-btn">PLAY</button>

    <label class="touch-row">
      <input type="checkbox" id="touch-mode" />
      <span>Touch mode</span>
    </label>
    <p id="touch-note" style="display:none;margin-top:8px;font-size:0.78rem;color:#fbbf24;line-height:1.35;">
      Note: This feature is unstable. Still want it? Turn off "Touch Mode" in Options &gt; Control &gt; Touch Mode if you don't want double control.
    </p>

    <div class="divider"></div>

    <a id="mods-link" class="mods-btn" href="#" target="_blank" rel="noopener">
      Discover my mods :&gt;
    </a>
  </div>

  <script>
    // Edit these URLs anytime to add other versions or your mods repo
    const VERSIONS = [
      { name: "Fast-Eaglercraft 26.3", url: "./26.3/index.html" },
      { name: "Fast-Eaglercraft 26.2", url: "./play.html" },
    ];
    const MODS_URL = "https://github.com/MadanaSnake";

    const select = document.getElementById("version-select");
    const playBtn = document.getElementById("play-btn");
    const touchBox = document.getElementById("touch-mode");
    const modsLink = document.getElementById("mods-link");

    VERSIONS.forEach((v, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = v.name;
      select.appendChild(opt);
    });

    modsLink.href = MODS_URL;

    // Remember touch mode preference
    const touchNote = document.getElementById("touch-note");
    function syncTouchNote() {
      touchNote.style.display = touchBox.checked ? "block" : "none";
    }
    touchBox.checked = localStorage.getItem("fast_eagler_touch_mode") === "1";
    syncTouchNote();
    touchBox.addEventListener("change", () => {
      localStorage.setItem("fast_eagler_touch_mode", touchBox.checked ? "1" : "0");
      syncTouchNote();
    });

    playBtn.addEventListener("click", () => {
      const chosen = VERSIONS[Number(select.value)] || VERSIONS[0];
      const url = new URL(chosen.url, window.location.href);
      if (touchBox.checked) {
        url.searchParams.set("touch", "custom");
      }
      window.location.href = url.toString();
    });
  </script>
</body>
</html>
